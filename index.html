<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tierekisteriosoite</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#1a1a2e; color:white;
  }
  #page-home, #page-gallery {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    height:100dvh; width:100vw;
    padding-top: env(safe-area-inset-top);
  }
  #page-gallery { display:none; }
  body.gallery-active #page-home { display:none; }
  body.gallery-active #page-gallery { display:flex; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px;
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    background:#12122a; flex-shrink:0;
  }
  .topbar h1 { font-size:1em; color:#4cc9f0; display:flex; align-items:center; gap:6px; }
  .auto-dot { font-size:0.65em; color:#00c853; }
  .top-btn {
    background:rgba(76,201,240,0.15); border:1px solid #4cc9f0; color:#4cc9f0;
    padding:6px 10px; border-radius:8px; font-size:0.8em; font-weight:600; cursor:pointer;
  }

  .status { text-align:center; padding:4px; font-size:0.78em; flex-shrink:0; }
  .status.loading { background:rgba(76,201,240,0.2); color:#4cc9f0; }
  .status.error { background:rgba(247,37,133,0.2); color:#f72585; }
  .status.success { background:rgba(0,200,83,0.2); color:#00c853; }

  .info-box {
    background:linear-gradient(135deg,#16213e 0%,#1a1a2e 100%);
    border-bottom:2px solid #4cc9f0;
    padding:8px 10px;
    flex-shrink:0;
    max-height:42vh; overflow-y:auto;
    transition: max-height .25s ease, padding .25s ease, opacity .25s ease;
  }
  .info-box.collapsed { max-height:0; padding:0 10px; opacity:0; overflow:hidden; border-bottom:none; }

  .primary-type-label { text-align:center; font-size:0.65em; color:#aaa; text-transform:uppercase; }
  .address-display { font-size:1.5em; font-weight:bold; text-align:center; color:#f72585; margin:2px 0; }
  .road-name { text-align:center; font-size:0.82em; color:#4cc9f0; }
  .sub-info { text-align:center; font-size:0.68em; color:#9be8ff; margin-top:2px; }
  .sub-info.dim { color:#888; }

  .secondary-addresses { margin-top:5px; }
  .secondary-row {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(76,201,240,0.08); border-radius:8px; padding:4px 8px; margin-top:3px; font-size:0.72em;
  }
  .secondary-row .stype { color:#aaa; }
  .secondary-row .saddr { color:#4cc9f0; font-weight:bold; }
  .secondary-row .sdist { color:#888; }

  .extra-info { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:6px; }
  .extra-item { background:rgba(247,37,133,0.1); padding:5px; border-radius:8px; text-align:center; }
  .extra-item.direction-forward { background:rgba(0,200,83,0.2); }
  .extra-item.direction-backward { background:rgba(255,152,0,0.2); }
  .extra-label { font-size:0.58em; color:#aaa; text-transform:uppercase; }
  .extra-value { font-size:0.85em; font-weight:bold; color:#4cc9f0; }
  .extra-item.direction-forward .extra-value { color:#00c853; }
  .extra-item.direction-backward .extra-value { color:#ff9800; }

  .coords { font-size:0.68em; color:#888; text-align:center; margin-top:4px; }

  .map-wrap { position:relative; flex:1 1 auto; min-height:0; }
  #map { position:absolute; inset:0; }
  .map-expand-btn {
    position:absolute; top:8px; right:8px; z-index:500;
    background:rgba(20,20,40,0.85); border:2px solid #4cc9f0; color:#4cc9f0;
    width:38px; height:38px; border-radius:10px; font-size:1.1em; cursor:pointer;
  }
  .map-recenter-btn {
    position:absolute; top:52px; right:8px; z-index:500;
    background:rgba(20,20,40,0.85); border:2px solid #00c853; color:#00c853;
    width:38px; height:38px; border-radius:10px; font-size:1em; cursor:pointer;
  }

  .radius-bar {
    display:flex; align-items:center; gap:8px;
    padding:6px 12px; background:#12122a; flex-shrink:0; font-size:0.78em;
  }
  .radius-bar input[type=range] { flex:1; accent-color:#4cc9f0; }
  .radius-val { color:#4cc9f0; font-weight:bold; min-width:44px; text-align:right; }

  .filter-buttons { display:flex; gap:5px; padding:6px 10px; background:#12122a; flex-shrink:0; }
  .filter-btn {
    flex:1; padding:8px 2px; border:2px solid #4cc9f0; border-radius:14px;
    background:transparent; color:#4cc9f0; font-size:0.78em; font-weight:600; cursor:pointer;
  }
  .filter-btn.active { background:#4cc9f0; color:#1a1a2e; }
  .filter-btn:active { transform:scale(0.95); }

  .btn-group {
    display:flex; gap:6px; padding:8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    background:#12122a; flex-shrink:0;
  }
  .btn { flex:1; padding:12px 2px; border:none; border-radius:10px; font-size:0.85em; font-weight:bold; cursor:pointer; color:white; }
  .btn-primary { background:linear-gradient(135deg,#4cc9f0 0%,#4361ee 100%); }
  .btn-secondary { background:linear-gradient(135deg,#f72585 0%,#b5179e 100%); }
  .btn-video { background:linear-gradient(135deg,#ff9800 0%,#e65100 100%); }
  .btn:active { transform:scale(0.95); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .gallery-topbar {
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    background:#12122a; flex-shrink:0;
  }
  .gallery-topbar h1 { font-size:1em; color:#4cc9f0; flex:1; }
  .gallery-map-wrap { position:relative; height:32vh; flex-shrink:0; }
  #gallery-map { position:absolute; inset:0; }
  .sort-bar { display:flex; gap:6px; align-items:center; padding:8px 10px; background:#12122a; flex-shrink:0; }
  .sort-bar label { font-size:0.78em; color:#aaa; }
  .sort-bar select {
    flex:1; background:#1a1a2e; color:#4cc9f0; border:1px solid #4cc9f0; border-radius:8px; padding:6px; font-size:0.85em;
  }
  .gallery-list { flex:1; overflow-y:auto; padding:8px 10px; }
  .gallery-empty { text-align:center; color:#888; margin-top:40px; font-size:0.9em; }
  .gallery-item {
    display:flex; gap:10px; background:#16213e; border-radius:10px; padding:8px; margin-bottom:8px; align-items:center;
  }
  .gallery-thumb { width:64px; height:64px; border-radius:8px; object-fit:cover; background:#000; flex-shrink:0; }
  .gallery-thumb.video-thumb { display:flex; align-items:center; justify-content:center; font-size:1.6em; }
  .gallery-meta { flex:1; min-width:0; }
  .gallery-addr { color:#f72585; font-weight:bold; font-size:0.95em; }
  .gallery-sub { color:#9be8ff; font-size:0.72em; }
  .gallery-date { color:#888; font-size:0.7em; }
  .gallery-del { background:rgba(247,37,133,0.2); border:none; color:#f72585; border-radius:8px; padding:8px 10px; font-size:0.9em; }

  .camera-section { display:none; position:fixed; inset:0; background:#000; z-index:1000; flex-direction:column; }
  .camera-section.active { display:flex; }
  #video { flex:1; width:100%; object-fit:cover; }
  .live-overlay {
    position:absolute; bottom:130px; left:10px; right:10px; background:rgba(0,0,0,0.6);
    color:#4cc9f0; padding:10px; border-radius:10px; font-size:0.95em; text-align:center; font-weight:bold;
    pointer-events:none; white-space:pre-line;
  }
  .audio-toggle {
    position:absolute; top:calc(50px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:5; background:rgba(0,0,0,0.6); color:#4cc9f0; border:1px solid #4cc9f0;
    padding:8px 14px; border-radius:20px; font-size:0.8em; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .audio-toggle.on { color:#00c853; border-color:#00c853; }
  .camera-controls { position:absolute; bottom:30px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:30px; }
  .capture-btn { width:70px; height:70px; border-radius:50%; background:white; border:4px solid #4cc9f0; cursor:pointer; }
  .capture-btn.recording { background:#f72585; border-color:#ff9800; animation:recpulse 1s infinite; }
  @keyframes recpulse { 0%,100%{box-shadow:0 0 0 0 rgba(247,37,133,.6);} 50%{box-shadow:0 0 0 12px rgba(247,37,133,0);} }
  .capture-btn:active { transform:scale(0.9); }
  .rec-time { position:absolute; top:55px; left:20px; background:rgba(247,37,133,.85); color:white; padding:6px 14px; border-radius:15px; font-weight:bold; display:none; }
  .rec-time.active { display:block; }
  .close-camera { position:absolute; top:50px; right:20px; background:rgba(0,0,0,.5); color:white; border:none; padding:10px 20px; border-radius:20px; font-size:1em; cursor:pointer; }
  .preview-section { display:none; position:fixed; inset:0; background:#000; z-index:1001; flex-direction:column; }
  .preview-section.active { display:flex; }
  #preview-canvas { flex:1; width:100%; object-fit:contain; background:#000; }
  #preview-video { flex:1; width:100%; object-fit:contain; background:#000; display:none; }
  .preview-controls { position:absolute; bottom:30px; left:0; right:0; display:flex; justify-content:center; gap:20px; }
  .preview-btn { padding:15px 30px; border:none; border-radius:25px; font-size:1em; font-weight:bold; cursor:pointer; }
  .preview-btn.save { background:#00c853; color:white; }
  .preview-btn.cancel { background:#f72585; color:white; }

  .media-viewer {
    display:none; position:fixed; inset:0; z-index:1100; background:rgba(0,0,0,0.92);
    flex-direction:column; align-items:center; justify-content:center; padding:20px;
    padding-top: max(60px, env(safe-area-inset-top));
  }
  .media-viewer.active { display:flex; }
  .mv-close {
    position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px;
    background:rgba(255,255,255,0.15); color:white; border:none;
    padding:10px 18px; border-radius:20px; font-size:0.95em; cursor:pointer;
  }
  .mv-content { max-width:100%; max-height:80vh; display:flex; align-items:center; justify-content:center; }
  .mv-content img, .mv-content video { max-width:100%; max-height:80vh; border-radius:10px; }
  .mv-caption { color:#9be8ff; font-size:0.85em; margin-top:14px; text-align:center; }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .loading .address-display { animation:pulse 1.5s infinite; }
</style>
</head>
<body>

<div id="page-home">
  <div class="topbar">
    <h1>🛣️ Tierekisteriosoite <span class="auto-dot">● AUTO</span></h1>
    <div style="display:flex; gap:6px;">
      <button class="top-btn" onclick="location.href='gopro.html'">🎬 GoPro</button>
      <button class="top-btn" onclick="showGallery()">🖼️ Galleria</button>
    </div>
  </div>

  <div id="status" class="status loading">Odotetaan GPS-sijaintia...</div>

  <div class="info-box" id="info-box">
    <div class="primary-type-label" id="primary-type"></div>
    <div class="address-display" id="address">-</div>
    <div class="road-name" id="road-name"></div>
    <div class="sub-info" id="paallyste-info"></div>
    <div class="sub-info dim" id="kaista-info"></div>
    <div class="secondary-addresses" id="secondary-addresses"></div>
    <div class="extra-info">
      <div class="extra-item" id="direction-box">
        <div class="extra-label">Suunta</div>
        <div class="extra-value" id="direction">-</div>
      </div>
      <div class="extra-item">
        <div class="extra-label">GPS-tarkkuus</div>
        <div class="extra-value" id="accuracy">-</div>
      </div>
      <div class="extra-item">
        <div class="extra-label">Etäisyys tiehen</div>
        <div class="extra-value" id="road-dist">-</div>
      </div>
    </div>
    <div class="coords" id="coords">-</div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <button class="map-expand-btn" onclick="toggleMapExpand()" id="map-expand-btn">⤢</button>
    <button class="map-recenter-btn" onclick="recenterMap()" id="map-recenter-btn">🎯</button>
  </div>

  <div class="radius-bar">
    <label>Hakusäde</label>
    <input type="range" id="radius-slider" min="10" max="100" step="10" value="30" oninput="onRadiusChange(this.value)">
    <span class="radius-val" id="radius-val">30 m</span>
  </div>

  <div class="filter-buttons">
    <button class="filter-btn active" id="filter-tie" onclick="toggleFilter('tie')">🛣️ Tie</button>
    <button class="filter-btn" id="filter-ramppi" onclick="toggleFilter('ramppi')">🔀 Ramppi</button>
    <button class="filter-btn" id="filter-kevyt" onclick="toggleFilter('kevyt')">🚴 Kevyt</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="manualRefresh()">🔄 Päivitä</button>
    <button class="btn btn-secondary" id="camera-btn" onclick="openCamera(false)" disabled>📷 Kuva</button>
    <button class="btn btn-video" id="video-btn" onclick="openCamera(true)" disabled>🎥 Video</button>
  </div>
</div>

<div id="page-gallery">
  <div class="gallery-topbar">
    <button class="top-btn" onclick="showHome()">← Takaisin</button>
    <h1>🖼️ Kuvat &amp; videot</h1>
  </div>
  <div class="gallery-map-wrap"><div id="gallery-map"></div></div>
  <div class="sort-bar">
    <label>Järjestys</label>
    <select id="sort-select" onchange="renderGallery()">
      <option value="date-desc">Uusin ensin</option>
      <option value="date-asc">Vanhin ensin</option>
      <option value="tie-asc">Tie ↑</option>
      <option value="tie-desc">Tie ↓</option>
      <option value="etaisyys-asc">Etäisyys ↑</option>
      <option value="type">Väylätyyppi</option>
    </select>
  </div>
  <div class="gallery-list" id="gallery-list"></div>
</div>

<div class="media-viewer" id="media-viewer" onclick="closeMediaViewer(event)">
  <button class="mv-close" onclick="closeMediaViewer(event, true)">✕ Sulje</button>
  <div class="mv-content" id="mv-content"></div>
  <div class="mv-caption" id="mv-caption"></div>
</div>

<div class="camera-section" id="camera-section">
  <button class="close-camera" onclick="closeCamera()">✕ Sulje</button>
  <div class="rec-time" id="rec-time">● 0:00</div>
  <div class="audio-toggle" id="audio-toggle" onclick="toggleAudio()">🔇 Äänet pois – napauta ottaaksesi käyttöön</div>
  <video id="video" autoplay playsinline muted></video>
  <div class="live-overlay" id="live-overlay"></div>
  <div class="camera-controls"><button class="capture-btn" id="capture-btn" onclick="captureAction()"></button></div>
</div>

<div class="preview-section" id="preview-section">
  <canvas id="preview-canvas"></canvas>
  <video id="preview-video" controls playsinline></video>
  <div class="preview-controls">
    <button class="preview-btn cancel" onclick="cancelPreview()">❌ Hylkää</button>
    <button class="preview-btn save" onclick="saveMedia()">💾 Tallenna</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.min.js"></script>
<script>
